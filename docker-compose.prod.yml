# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    environment:
      - LOG_LEVEL=info
      - RATE_LIMIT_PER_MINUTE=60
      # set API_KEY and a real origin list in .env for production
