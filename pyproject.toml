[project]
name = "genesis-rag"
version = "0.1.0"
description = "Genesis RAG: an agentic RAG system with hybrid retrieval, sharding, PageRank authority boosting and security guards."
authors = [{ name = "Rohan Malyadri (Obscuron X Labs)" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn",
    "chromadb",
    "redis[hiredis]",
    "rank-bm25",
    "google-generativeai",
    "langchain",
    "tiktoken",
    "presidio-analyzer",
    "spacy",
    "fastembed",
    "datasketch",
    "pdfplumber",
    "pytesseract",
    "python-docx",
    "beautifulsoup4",
    "chardet",
    "opik",
    "python-multipart",
    "aiofiles",
    "httpx",
    "pydantic-settings",
    "python-magic",
    "tabulate",
    "pillow",
    "opencv-python-headless",
    "networkx",
    "celery",
    "scipy",
    "numpy",
    "neo4j",
    "openai",
]

[project.optional-dependencies]
# Knowledge-graph extraction (Neo4j + REBEL relation extraction). Heavy: pulls in PyTorch.
graph = [
    "torch",
    "transformers",
    "spacy-transformers",
]
# Use PyTorch sentence-transformers instead of the lighter ONNX embeddings.
torch-embeddings = ["sentence-transformers"]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "testcontainers[neo4j]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "routes*", "services*", "retrieval*", "agents*", "pipeline*", "security*", "prompts*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
